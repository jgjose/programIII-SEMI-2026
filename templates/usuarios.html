<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-3">
  <span class="navbar-brand">Registro de Usuarios</span>
  <span class="text-white">Sesión: {{ activo }} &nbsp; <a href="/logout" class="btn btn-sm btn-light">Salir</a></span>
</nav>

<div class="container mt-4">
  <div class="card shadow mb-4">
    <div class="card-header">Formulario de usuario</div>
    <div class="card-body">
      <form id="frmUsuarios">
        <input type="hidden" id="idUsuario">
        <div class="row g-3">
          <div class="col-md-4"><label class="form-label">Usuario</label>
            <input id="usuario" maxlength="35" class="form-control" required></div>
          <div class="col-md-4"><label class="form-label">Clave <small class="text-muted" id="notaClave"></small></label>
            <input id="clave" type="password" maxlength="35" class="form-control"></div>
          <div class="col-md-4"><label class="form-label">Nombre</label>
            <input id="nombre" maxlength="85" class="form-control" required></div>
          <div class="col-md-8"><label class="form-label">Dirección</label>
            <input id="direccion" maxlength="100" class="form-control"></div>
          <div class="col-md-4"><label class="form-label">Teléfono</label>
            <input id="telefono" maxlength="9" placeholder="0000-0000" class="form-control"></div>
        </div>
        <div class="mt-3">
          <button class="btn btn-success" id="btnGuardar">Guardar</button>
          <button type="button" class="btn btn-secondary" id="btnLimpiar">Nuevo / Limpiar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow">
    <div class="card-header">
      <input id="txtBuscar" class="form-control" placeholder="Buscar por usuario, nombre o teléfono...">
    </div>
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead><tr><th>ID</th><th>Usuario</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Acciones</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/usuarios.js') }}"></script>
</body>
</html>
