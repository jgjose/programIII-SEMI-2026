<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width:400px; margin-top:12vh">
  <div class="card shadow">
    <div class="card-header bg-primary text-white text-center"><h4>Iniciar sesión</h4></div>
    <div class="card-body">
      <form id="frmLogin">
        <div class="mb-3"><label class="form-label">Usuario</label>
          <input type="text" id="txtUsuario" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Clave</label>
          <input type="password" id="txtClave" class="form-control" required></div>
        <button class="btn btn-primary w-100">Ingresar</button>
      </form>
      <div id="msg" class="alert alert-danger mt-3 d-none"></div>
    </div>
  </div>
</div>
<script>
document.getElementById("frmLogin").addEventListener("submit", async e => {
  e.preventDefault();
  const r = await fetch("/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({usuario: txtUsuario.value, clave: txtClave.value})
  });
  const d = await r.json();
  if (d.ok) location.href = "/usuarios";
  else { msg.textContent = d.msg; msg.classList.remove("d-none"); }
});
</script>
</body>
</html>
