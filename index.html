<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python como backend</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <body class="container-fluid">
        Hola: <span id="divRespuesta"></span>
        <form id="frmSaludo">
            <form id="frmSaludo" class="mt-3">
                <label for="nombre">Nombre</label>
                <input type="text" id="txtNombre" name="txtNombre">
                <button type="submit">Saludar</button>
                <button class="btn btn-primary" type="submit">Saludar</button>
            </form>
    </body>
    <script>
        frmSaludo.onsubmit = function (e) {
            e.preventDefault();
            fetch(`/saludo?nombre=${txtNombre.value}`)
                .then(response => response.text())
                .then(data => {
                    divRespuesta.innerHTML = data;
                });
        }
    </script>
