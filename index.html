<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de impuestos a las actividades economicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="row">
        <div class="col-6">
            <div class="container text-center">
                <div class="row">
                    <div class="col">
                        <input placeholder="Codigo" name="txtCodigoCliente" id="txtCodigoCliente" class="form-control"
                            type="text">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <input placeholder="Nombre" name="txtNombreCliente" id="txtNombreCliente" class="form-control"
                            type="text">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <input placeholder="Direccion" name="txtDireccionCliente" id="txtDireccionCliente"
                            class="form-control" type="text">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <input placeholder="Telefono" name="txtTelefonoCliente" id="txtTelefonoCliente"
                            class="form-control" type="text">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <input placeholder="Email" name="txtEmailCliente" id="txtEmailCliente" class="form-control"
                            type="text">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <select class="form-control" name="cboTipoPersona" id="cboTipoPersona">
                            <option value="particular">Particular</option>
                            <option value="empresa">Empresa</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <input type="button" value="Guardar" class="btn btn-primary">
                        <input type="button" value="Buscar" class="btn btn-secondary">
                        <input type="reset" value="Limpiar" class="btn btn-warning">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6">

        </div>
    </div>
    </div>
</body>
<script>

</script>

</html>
